<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products for Men's</title>
    <!-- Tailwind CSS CDN load kar rahe hain --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons load kar rahe hain --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-blue': '#3b82f6',
                        'background': '#fefefe',
                    }
                }
            }
        }
    </script>
    <style>
        .category-card {
            transition: all 0.3s ease-in-out;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-background font-sans p-6 md:p-12">

    <header class="text-center mb-12">
        <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 leading-tight">
            Products for Men's
        </h1>
        <p class="mt-3 text-xl text-gray-500">Apni pasand ki category chuniye</p>
    </header>

    <section class="mb-16 max-w-6xl mx-auto">
        <!-- Category Grid: Mobile par 2 columns, bade screen par 3 ya 6 columns --><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">

            <!-- Category Card 1: Groom --><a href="https://apni-mens-link.com/groom" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-cut text-4xl text-brand-blue mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Groom</p>
            </a>
            
            <!-- Category Card 2: Cloth --><a href="https://apni-mens-link.com/cloth" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-male text-4xl text-brand-blue mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Cloth</p>
            </a>
            
            <!-- Category Card 3: Purse (Wallet) --><a href="https://kshamendermisrha.github.io/Products.github.io/Purse_Link.html" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-wallet text-4xl text-brand-blue mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Purse</p>
            </a>
            
            <!-- Category Card 4: Shoes --><a href="https://apni-mens-link.com/shoes" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-running text-4xl text-brand-blue mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Shoes</p>
            </a>
            
            <!-- Category Card 5: Men's Accessories (Icon added here!) --><a href="https://apni-mens-link.com/accessories" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-watch text-4xl text-brand-blue mb-3"></i> <!-- Watch icon added --><p class="text-lg font-semibold text-gray-700">Men's accessories</p>
            </a>

            <!-- Category Card 6: Tools --><a href="Link.html" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-blue flex flex-col items-center text-center">
                <i class="fas fa-wrench text-4xl text-brand-blue mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Tools</p>
            </a>

        </div>
    </section>

    <!-- Go Back Button --><div class="text-center mt-12">
        <a href="./index.html" class="inline-block px-8 py-3 bg-gray-300 text-gray-800 font-bold rounded-full hover:bg-gray-400 transition duration-300">
            ← Main Page Par Wapas Jayein
        </a>
    </div>

</body>
</html>
