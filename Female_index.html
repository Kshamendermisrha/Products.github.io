<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products for Female</title>
    <!-- Tailwind CSS CDN load kar rahe hain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons load kar rahe hain -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-pink': '#ec4899', 
                        'background': '#fefefe',
                    }
                }
            }
        }
    </script>
    <style>
        .category-card {
            transition: all 0.3s ease-in-out;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-background font-sans p-6 md:p-12">

    <header class="text-center mb-12">
        <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 leading-tight">
            Products for Female
        </h1>
        <p class="mt-3 text-xl text-gray-500">Apni pasand ki category chuniye</p>
    </header>

    <section class="mb-16 max-w-6xl mx-auto">
        <!-- Category Grid: Mobile par 2 columns, bade screen par 3 ya 6 columns -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">
            
            <!-- Category Card 1: Make up -->
            <a href="https://apni-female-link.com/makeup" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-palette text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Make up</p>
            </a>
            
            <!-- Category Card 2: Cloths -->
            <a href="https://apni-female-link.com/cloths" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-female text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Cloths</p>
            </a>
            
            <!-- Category Card 3: Jewellery -->
            <a href="https://apni-female-link.com/jewellery" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-ring text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Jewellery</p>
            </a>
            
            <!-- Category Card 4: Purse -->
            <a href="https://apni-female-link.com/purse" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-shopping-bag text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Purse</p>
            </a>
            
            <!-- Category Card 5: Shoe -->
            <a href="https://apni-female-link.com/shoe" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-shoe-prints text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Shoe</p>
            </a>

            <!-- Category Card 6: Kitchen -->
            <a href="https://apni-female-link.com/kitchen" class="category-card bg-white p-4 rounded-xl shadow-lg border-2 border-transparent hover:border-brand-pink flex flex-col items-center text-center">
                <i class="fas fa-utensils text-4xl text-brand-pink mb-3"></i>
                <p class="text-lg font-semibold text-gray-700">Kitchen</p>
            </a>

        </div>
    </section>

    <!-- Go Back Button -->
    <div class="text-center mt-12">
        <a href="./index.html" class="inline-block px-8 py-3 bg-gray-300 text-gray-800 font-bold rounded-full hover:bg-gray-400 transition duration-300">
            ← Main Page Par Wapas Jayein
        </a>
    </div>

</body>
</html>
